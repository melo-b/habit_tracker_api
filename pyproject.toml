[project]
name = "habit-tracker-api"
version = "0.1.0"
description = "REST API for tracking daily habits, built with Django and DRF."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.5,<6.1",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.29.0",
    "django-cors-headers>=4.9.0",
    "psycopg2-binary>=2.9.12",
    "gunicorn>=26.0.0",
    "python-dotenv>=1.2.2",
    "sentry-sdk>=2.65.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "pytest-cov",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.coverage.run]
source = ["accounts", "habits", "core"]
omit = ["*/migrations/*", "core/asgi.py", "core/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
extend-exclude = ["migrations"]
