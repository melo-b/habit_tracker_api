name: Django API CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. Spin up a temporary PostgreSQL database for the tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: yourpassword
          POSTGRES_DB: habit_tracker_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    # 2. Check out your code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 3. Install uv (reads the Python version from .python-version)
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    # 4. Install locked dependencies (runtime + dev group)
    - name: Install Dependencies
      run: uv sync --frozen

    # 5. Lint with Ruff (syntax errors and undefined names, same scope as before)
    - name: Lint with Ruff
      run: uv run ruff check --select E9,F63,F7,F82 .

    # 6. Run the Pytest suite
    - name: Run Tests with Pytest
      env:
        SECRET_KEY: "dummy-secret-key-for-ci-testing"
        DEBUG: "True"
        DB_NAME: "habit_tracker_db"
        DB_USER: "postgres"
        DB_PASSWORD: "yourpassword"
        DB_HOST: "localhost" 
        DB_PORT: "5432"     
      run: uv run pytest --cov